<!DOCTYPE html>
<html>
    <head>
        <title>Weather Fetch</title>
        <script src="index.js" defer></script>
    </head>    
    <body>
    <div id="dashboard">
        <p id="status">Loading...</p>
        
        <div id="content" style="display: none;">
            <div class="weather">
                <h2>SOME WEATHER INFO</h2>
                <p>Temperate: <span id="temp"></span>°C</p>
                <p>Feels Like: <span id="feeltemp"></span>°C</p>
                <p>Humidity: <span id="humidity"></span>%</p>
                <p>Precipitation: <span id="precip"></span>%</p>
                <p>Wind Speed: <span id="windspeed"></span> km/h</p>
            </div>
            

        </div>
        
    </body>
</html>
